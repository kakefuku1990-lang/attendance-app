<!doctype html>
<html>
<head>
    <title>打刻一覧</title>
</head>
<body>

<h1>自分の打刻一覧</h1>

<table border="1">
    <tr>
        <th>日付</th>
        <th>ステータス</th>
        <th>出勤</th>
        <th>退勤</th>
        <th>残業</th>
    </tr>

    {% for d in days %}
    <tr>
        <td>{{ d.date }}</td>
    
        <td>
            {% if d.record %}
                <span style="color: green;">出勤</span>
            {% elif d.leave %}
                <span style="color: blue;">休暇</span>
            {% else %}
                <span style="color: gray;">-</span>
            {% endif %}
        </td>
    
        <td>{{ d.record.clock_in|default:"-" }}</td>
        <td>{{ d.record.clock_out|default:"-" }}</td>
    
        <td>
            {% if d.record %}
                {{ d.record.overtime_duration }}
            {% endif %}
        </td>
    </tr>
    {% endfor %}
</table>

<br>

<a href="{% url 'attendance:today' %}">打刻ページへ</a>
<br>
<a href="/">トップへ戻る</a>

</body>
</html>
