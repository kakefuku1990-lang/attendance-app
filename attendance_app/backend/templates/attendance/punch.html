<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>今日の打刻</title>
  </head>
  <body>
    <h1>今日の打刻</h1>

    <p>ログイン中: {{ user.username }}</p>
    <p>日付: {{ record.date }}</p>
    <p>出勤時刻: {{ record.clock_in|default:"未打刻" }}</p>
    <p>退勤時刻: {{ record.clock_out|default:"未打刻" }}</p>

    <form method="post" style="margin-bottom: 12px;">
      {% csrf_token %}
      <input type="hidden" name="action" value="clock_in" />
      <button type="submit" {% if record.clock_in %}disabled{% endif %}>出勤</button>
    </form>

    <form method="post" style="margin-bottom: 12px;">
      {% csrf_token %}
      <input type="hidden" name="action" value="clock_out" />
      <button type="submit" {% if not record.clock_in or record.clock_out %}disabled{% endif %}>退勤</button>
    </form>

    <p><a href="/">トップへ戻る</a></p>
  </body>
</html>
