<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>勤怠管理アプリ（仮）</title>
  </head>
  <body>
    <h1>勤怠管理アプリ（仮）</h1>
    
    {% if user.is_authenticated %}
    <p>{{ user.username }} さんでログイン中</p>
    <p><a href="/attendance/punch/">今日の打刻ページへ</a></p>
    <p><a href="/attendance/list/">打刻履歴を見る</a></p>
    <!-- <p><a href="/accounts/logout/">ログアウト</a></p> -->
    <form method="post" action="/accounts/logout/">
      {% csrf_token %}
      <button type="submit">ログアウト</button>
    </form>
  {% else %}
    <p>未ログイン</p>
    <p><a href="/accounts/login/">ログイン</a></p>
  {% endif %}
  </body>
</html>
